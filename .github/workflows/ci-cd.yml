name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-app:latest .

    - name: Push Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-app:latest

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Test Stage
      run: echo "Testing successful"

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
    - name: Pull latest image
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/devops-app:latest

    - name: Stop old container
      run: docker stop devops-app || true

    - name: Remove old container
      run: docker rm devops-app || true

    - name: Run new container
      run: docker run -d -p 80:80 --name devops-app ${{ secrets.DOCKER_USERNAME }}/devops-app:latest
